submission:
  title: "NEXORA — AI-Powered Power Grid Intelligence"

  problem_statement: >
    Power distribution networks depend on critical equipment such as
    transformers, substations, and feeders, where unexpected failures and
    power outages can cause service interruptions, equipment damage, increased
    maintenance costs, and reduced grid reliability. Grid operators need an
    intelligent way to identify abnormal conditions early, estimate potential
    outage and equipment-failure risk, understand the factors contributing to
    that risk, and support timely preventive action.

  solution_summary: >
    NEXORA is an AI-powered grid intelligence solution that analyzes simulated
    grid and equipment operating data, detects abnormal conditions, estimates
    power outage and equipment-failure risk, evaluates grid and equipment
    health, generates alerts, and provides asset-specific explanations and
    preventive recommendations through an interactive web dashboard.

  key_features:
    - "Power outage risk estimation based on current grid operating conditions"
    - "Equipment failure-risk prediction for transformers, substations, and feeders"
    - "Anomaly detection across operating measurements including load, voltage, current, temperature, oil temperature, and vibration"
    - "Grid and equipment health scoring with risk classification, active alerts, and historical trends"
    - "AI Failure Advisor providing asset-specific risk explanations, estimated risk windows, and preventive-maintenance recommendations"

  tech_stack:
    languages:
      - "Python"
      - "JavaScript"
    frameworks:
      - "FastAPI"
    ibm_technologies:
      - "IBM Bob IDE"
    databases: []
    other:
      - "Scikit-learn"
      - "Pandas"
      - "NumPy"
      - "HTML"
      - "CSS"
      - "Git"
      - "GitHub"
      - "GitHub Actions"

  what_we_are_most_proud_of: >
    NEXORA brings monitoring, anomaly detection, risk estimation, health
    assessment, alerting, explanation, and preventive guidance together in one
    operator-focused workflow. The strongest part of the prototype is the
    dynamic AI Failure Advisor, which responds to the selected asset's current
    condition and provides the contributing factors, estimated risk window,
    trend information, and recommended actions needed for preventive
    decision-making.

  known_limitations: >
    The current proof of concept uses simulated or synthetic grid and sensor
    data rather than live utility telemetry. Application state and recent
    history are maintained in memory, so restarting the backend resets the
    runtime state. Prediction quality depends on the available training data,
    and estimated failure windows are risk estimates rather than guaranteed
    failure times. The current implementation does not yet use external
    watsonx.ai services or a persistent production database. IBM Bob IDE was
    used as the primary AI development environment for building and refining
    the application.

