submission:
  title: "NEXORA — AI-Powered Power Grid Intelligence"

  problem_statement: >
    Power distribution networks depend on critical equipment such as
    transformers, substations, and feeders, where unexpected failures and
    power outages can cause service interruptions, equipment damage, increased
    maintenance costs, and reduced grid reliability. Grid operators need an
    intelligent way to identify abnormal conditions early, predict potential
    outages and equipment failures, and support timely preventive action.

  solution_summary: >
    NEXORA is an AI-powered grid intelligence solution designed to analyze
    grid and equipment data, detect abnormal operating conditions, predict
    power outages and equipment failures, assess grid and equipment health,
    and provide actionable recommendations to support proactive maintenance
    and outage management.

  key_features:
    - "Power outage prediction based on grid operating conditions and historical patterns"
    - "Grid equipment failure prediction for transformers, substations, feeders, and other assets"
    - "Anomaly detection across voltage, current, load, temperature, frequency, vibration, and environmental conditions"
    - "Grid and equipment health scoring with risk-based alerts and historical trends"
    - "AI-powered failure advisory with risk explanations and preventive-maintenance recommendations"

  tech_stack:
    languages:
      - "Python"
      - "JavaScript"
    frameworks:
      - "FastAPI"
    ibm_technologies: []
    databases: []
    other:
      - "GitHub"
      - "GitHub Actions"

  what_we_are_most_proud_of: >
    NEXORA combines prediction, anomaly detection, health assessment, risk
    alerts, explanations, and actionable recommendations into a single
    workflow designed to help operators identify emerging grid risks and
    take preventive action before failures develop into major outages.

  known_limitations: >
    The initial proof of concept may use simulated or synthetic grid and
    sensor data where real-time utility data is unavailable. Prediction
    quality will depend on the available training data, and estimated
    failure windows are risk estimates rather than guaranteed failure times.
    IBM-specific technologies will be added once they are actually integrated
    and tested in the project.

